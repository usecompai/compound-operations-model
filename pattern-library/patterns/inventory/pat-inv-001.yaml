id: PAT-INV-001
domain: inventory
type: threshold
title: Reconcile inventory across channels
context: Multi-channel brands have inventory discrepancies causing overselling. Daily
  syncs arent enough.
pattern: '1. Cron every 30min during business hours (07:00-21:00)

  2. Query all stock sources: Shopify, POS, 3PL, wholesale reserves

  3. Flag discrepancies >2 units between systems

  4. Alert on variants <3 units (critical) or negative (oversold)

  5. Weekly summary of discrepancies found and resolved'
conditions:
- Multi-channel retail (online + physical + wholesale)
- More than 1 inventory source
anti_patterns:
- Dont sync more than every 15min (API rate limits)
- Dont auto-adjust if discrepancy >10 units (human review)
tags:
- inventory
- sync
- multi-channel
- stockout
status: reference_pattern
public_note: Reusable procedure, not measured company results. Configure and test
  before use.
